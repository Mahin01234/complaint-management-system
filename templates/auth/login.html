
{% extends "base_public.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4 p-lg-5 shadow-sm border-0">

      <!-- Header -->
      <div class="text-center mb-4">
        <div class="stat-icon bg-primary-subtle text-primary mx-auto mb-3">
          <i class="bi bi-box-arrow-in-right"></i>
        </div>

        <h4 class="fw-bold mb-1">Login</h4>
        <p class="text-muted small mb-0">
          Select your role and enter account
        </p>
      </div>

      <!-- Login Form -->
      <form method="post"
            action="{{ url_for('login') }}"
            autocomplete="off">

        <!-- Role Selection -->
        <div class="mb-3">
          <label class="form-label small fw-semibold">
            Login As *
          </label>

          <select name="role"
                  id="roleSelect"
                  class="form-select bg-light"
                  required>

            <option value="user" selected>User</option>
            <option value="officer">Officer</option>
            <option value="admin">Admin</option>

          </select>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label small fw-semibold">
            Email
          </label>

          <div class="input-group">
            <span class="input-group-text bg-light">
              <i class="bi bi-envelope"></i>
            </span>

            <input
              type="email"
              name="email"
              id="emailInput"
              class="form-control"
              required
              autofocus
              autocomplete="off"
              placeholder="Enter your email"
              value=""
            >
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">

          <div class="d-flex justify-content-between align-items-center">

            <label class="form-label small fw-semibold mb-0">
              Password
            </label>

            <a href="{{ url_for('forgot_password') }}"
               class="small text-decoration-none">
              Forgot password?
            </a>

          </div>

          <div class="input-group mt-1">

            <span class="input-group-text bg-light">
              <i class="bi bi-lock"></i>
            </span>

            <input
              type="password"
              name="password"
              id="password"
              class="form-control"
              required
              minlength="6"
              autocomplete="new-password"
              placeholder="Enter your password"
              value=""
            >

            <button
              class="btn btn-outline-secondary"
              type="button"
              id="togglePassword"
              tabindex="-1"
            >
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>

          </div>
        </div>

        <!-- Remember Me -->
        <div class="form-check mb-3">

          <input
            class="form-check-input"
            type="checkbox"
            name="remember"
            id="remember"
          >

          <label class="form-check-label small" for="remember">
            Remember me
          </label>

        </div>

        <!-- Login Button -->
        <button type="submit"
                class="btn btn-primary w-100 py-2">
          Login
        </button>

      </form>

      <!-- Register -->
      <p class="text-center small text-muted mt-4 mb-0">
        Don't have an account?

        <a href="{{ url_for('register') }}"
           class="fw-semibold text-decoration-none">
          Register
        </a>
      </p>

    </div>
  </div>
</div>


<!-- Login Failed Popup -->
{% if login_error %}

<div id="simplePopup"
     style="
       position: fixed;
       top: 0;
       left: 0;
       width: 100%;
       height: 100%;
       background: rgba(0,0,0,0.6);
       z-index: 99999;
       display: flex;
       align-items: center;
       justify-content: center;
       backdrop-filter: blur(4px);
     ">

  <div style="
       background: white;
       width: 90%;
       max-width: 400px;
       border-radius: 15px;
       box-shadow: 0 10px 30px rgba(0,0,0,0.3);
       overflow: hidden;
       text-align: center;
       animation: popIn 0.3s ease-out;
     ">

    <div style="
         background: #dc3545;
         padding: 25px 20px;
         color: white;
       ">

      <i class="bi bi-x-circle"
         style="font-size: 4rem; line-height: 1;">
      </i>

      <h3 style="
          margin-top: 10px;
          margin-bottom: 0;
          font-weight: bold;
        ">
        Login Failed
      </h3>

    </div>

    <div style="padding: 25px;">

      <p style="
          color: #555;
          font-size: 16px;
          margin-bottom: 25px;
        ">
        {{ login_error }}
      </p>

      <button
        type="button"
        onclick="document.getElementById('simplePopup').style.display='none'"
        style="
          background: #dc3545;
          color: white;
          border: none;
          padding: 12px 20px;
          width: 100%;
          border-radius: 8px;
          font-size: 16px;
          font-weight: bold;
          cursor: pointer;
        ">
        Try Again
      </button>

    </div>

  </div>
</div>

<style>
  @keyframes popIn {
    0% {
      transform: scale(0.8);
      opacity: 0;
    }

    100% {
      transform: scale(1);
      opacity: 1;
    }
  }
</style>

{% endif %}


<!-- JavaScript -->
<script>

document.addEventListener('DOMContentLoaded', function () {

    // Get Elements
    const roleSelect = document.getElementById('roleSelect');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('password');

    const togglePassword = document.getElementById('togglePassword');
    const toggleIcon = document.getElementById('toggleIcon');


    // Password Show / Hide
    togglePassword.addEventListener('click', function () {

        const show = passwordInput.type === 'password';

        passwordInput.type = show ? 'text' : 'password';

        toggleIcon.classList.toggle('bi-eye', !show);
        toggleIcon.classList.toggle('bi-eye-slash', show);

    });


    // Role Based Auto-fill
    function updateCredentials() {

        const role = roleSelect.value;

        // Clear Previous Credentials
        emailInput.value = '';
        passwordInput.value = '';

        if (role === 'admin') {

            // Admin Credentials
            emailInput.value = 'mahinurrahman1631@gmail.com';
            passwordInput.value = 'admin123';

        }

        else if (role === 'officer') {

            // Officer Credentials
            emailInput.value = 'officer@cms.local';
            passwordInput.value = 'officer123';

        }

        else if (role === 'user') {

            // User manually enters Email and Password
            emailInput.value = '';
            passwordInput.value = '';

        }

    }


    // Role Change Event
    roleSelect.addEventListener('change', updateCredentials);


    // Initial Page Load
    updateCredentials();

});

</script>

{% endblock %}
